name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Run type check
        run: npm run build
      - name: Run cargo test
        run: cargo test
        working-directory: src-tauri
      - name: Run vitest
        run: npm run test:coverage
      - name: Run ESLint
        run: npm run lint
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.version }}
          releaseName: SkillForge ${{ inputs.version }}
          releaseBody: "See [CHANGELOG.md](https://github.com/WebbLee94/SkillForge/blob/master/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Run type check
        run: npm run build
      - name: Run cargo test
        run: cargo test
        working-directory: src-tauri
      - name: Run vitest
        run: npm run test:coverage
      - name: Run ESLint
        run: npm run lint
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.version }}
          releaseName: SkillForge ${{ inputs.version }}
          releaseBody: "See [CHANGELOG.md](https://github.com/WebbLee94/SkillForge/blob/master/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install dependencies
        run: npm ci
      - name: Run type check
        run: npm run build
      - name: Run cargo test
        run: cargo test
        working-directory: src-tauri
      - name: Run vitest
        run: npm run test:coverage
      - name: Run ESLint
        run: npm run lint
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.version }}
          releaseName: SkillForge ${{ inputs.version }}
          releaseBody: "See [CHANGELOG.md](https://github.com/WebbLee94/SkillForge/blob/master/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false
