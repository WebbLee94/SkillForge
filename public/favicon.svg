  <!-- Nodes -->
  <circle cx="13" cy="9" r="2" fill="#8b5cf6"/>
  <circle cx="22" cy="13" r="1.5" fill="#06b6d4"/>
  <circle cx="10" cy="19" r="1.2" fill="#3b82f6" opacity="0.7"/>
